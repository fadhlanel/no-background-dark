name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Package resource pack
        shell: bash
        run: |
          archive="NoBackgroundDark-${GITHUB_REF_NAME}.zip"
          zip -r "$archive" assets 1.21.11 1.21.6-1.21.10 pack.mcmeta pack.png
          unzip -t "$archive"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "NoBackgroundDark-${GITHUB_REF_NAME}.zip" \
            --title "No Background Dark $GITHUB_REF_NAME" \
            --generate-notes
